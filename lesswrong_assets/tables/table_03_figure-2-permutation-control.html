<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Figure 2: Permutation control</title>
  <style>
    :root {
      --ink: #22201c;
      --muted: #6f675d;
      --rule: #ddd7cc;
      --head: #f6f1e8;
      --stripe: #fbf8f2;
      --bg: #fffdf8;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: ui-serif, Georgia, Cambria, "Times New Roman", serif;
      padding: 28px;
    }
    .table-card {
      display: inline-block;
      background: #fffdf9;
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(45, 36, 24, 0.08);
      overflow: hidden;
    }
    .caption {
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-weight: 650;
      font-size: 20px;
      line-height: 1.25;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--rule);
      background: #fffaf0;
      max-width: 1180px;
    }
    table {
      border-collapse: collapse;
      font-size: 17px;
      line-height: 1.28;
      min-width: 620px;
      max-width: 1220px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--rule);
      vertical-align: middle;
      white-space: nowrap;
    }
    th {
      background: var(--head);
      color: #302b25;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 700;
    }
    tbody tr:nth-child(even) td {
      background: var(--stripe);
    }
    tbody tr:last-child td {
      border-bottom: 0;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
      background: #f0ebe1;
      border-radius: 4px;
      padding: 1px 4px;
    }
    .math {
      font-style: italic;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="table-card">
    <div class="caption">Figure 2: Permutation control</div>
    <table>
      <thead>
        <tr><th style="text-align:left">Probe family</th><th style="text-align:right">Top-decile real median tau</th><th style="text-align:right">Top-decile permuted median tau</th><th style="text-align:right">Reduction</th></tr>
      </thead>
      <tbody>
        <tr><td style="text-align:left">random</td><td style="text-align:right">1.0</td><td style="text-align:right">1.0</td><td style="text-align:right">0.0</td></tr>
        <tr><td style="text-align:left">PCA</td><td style="text-align:right">1.0</td><td style="text-align:right">1.0</td><td style="text-align:right">0.0</td></tr>
        <tr><td style="text-align:left">time-lagged</td><td style="text-align:right">17.0</td><td style="text-align:right">1.0</td><td style="text-align:right">0.941</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
